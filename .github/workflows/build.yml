name: Build APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: armeabi-v7a
            build_type: debug
          - abi: arm64-v8a
            build_type: debug
          - abi: x86
            build_type: debug
          - abi: x86_64
            build_type: debug
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules gettext ninja-build pkg-config

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          # 1. 将 build 替换为 assemble，仅生成 APK，不触发 Bundle 生成任务
          # 2. 传入 -Pandroid.injected.build.abi 参数，限制 Gradle 仅编译当前 Matrix 指定的 ABI
          ./gradlew assemble${BUILD_TYPE^} \
            -x test \
            --parallel \
            --build-cache \
            -Pandroid.ndkVersion=28.0.13004108 \
            -Pandroid.injected.build.abi=${{ matrix.abi }}

      - name: Upload APK Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}-${{ inputs.build_type || 'debug' }}
          path: app/build/outputs/apk/
          retention-days: 30

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.abi }}
          path: app/build/outputs/logs/
          retention-days: 7
