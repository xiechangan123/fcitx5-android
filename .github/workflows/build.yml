name: Build APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - abi: armeabi-v7a
            build_type: debug
          - abi: arm64-v8a
            build_type: debug
          - abi: x86
            build_type: debug
          - abi: x86_64
            build_type: debug
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 37
          ndk-version: 30.0.16248370

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          ./gradlew build${BUILD_TYPE^} \
            -x test \
            --parallel \
            --build-cache \
            -Pandroid.ndkVersion=30.0.16248370

      - name: Upload APK Artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}-${{ inputs.build_type || 'debug' }}
          path: app/build/outputs/apk/
          retention-days: 30

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.abi }}
          path: app/build/outputs/logs/
          retention-days: 7
